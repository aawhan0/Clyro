services:
  - type: web
    name: clyro
    runtime: python
    plan: free
    branch: feat/opportunity-source-schema
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir .
    healthCheckPath: /health
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-3-27b-it
